paths:
  cam:
    source: rpiCamera
    # rpiCameraWidth and Height removed for now
    rpiCameraFPS: 15
    rpiCameraBitrate: 8000000
    record: yes
    recordPath: /home/YOUR_USERNAME/videos/%path/%Y-%m-%d_%H-%M-%S
    recordSegmentDuration: 5m
    runOnRecordSegmentComplete: /home/YOUR_USERNAME/upload_to_pi5.sh
